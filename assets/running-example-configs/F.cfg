hostname F
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface GigabitEthernet0/0
 ip address 10.0.3.2 255.255.255.252
 description Connection to A
!
interface GigabitEthernet0/2
 ip address 10.0.5.1 255.255.255.252
 description Connection to E
!
ip as-path access-list 1 permit _600_
!
route-map setLP permit 10
 match as-path 1
 set local-preference 200
route-map setLP permit 20
 set local-preference 80
!

router bgp 300
  neighbor 10.0.3.1 remote-as 200
  neighbor 10.0.3.1 description Connection to A

  neighbor 10.0.5.2 remote-as 500
  neighbor 10.0.5.2 description Connection to E
  !
  address-family ipv4
    neighbor 10.0.3.1 activate
    neighbor 10.0.5.2 activate
    neighbor 10.0.3.1 route-map setLP in
    neighbor 10.0.5.2 route-map setLP in
  exit-address-family
!
