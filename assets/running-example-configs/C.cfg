hostname C
!
interface GigabitEthernet0/0
 ip address 10.0.2.2 255.255.255.252
 description Connection to B
!
!
interface GigabitEthernet0/1
 ip address 10.0.6.2 255.255.255.252
 description Connection to D
!
interface GigabitEthernet0/3
 ip address 10.0.4.1 255.255.255.252
 description Connection to E
!

ip prefix-list pl1 seq 5 permit 20.0.0.0/8
!
route-map FILTER deny 10
  match ip address prefix-list pl1
!
route-map FILTER permit 20

router bgp 600
  neighbor 10.0.2.1 remote-as 100
  neighbor 10.0.2.1 description Connection to B

  neighbor 10.0.6.1 remote-as 400
  neighbor 10.0.6.1 description Connection to D

  neighbor 10.0.4.2 remote-as 500
  neighbor 10.0.4.2 description Connection to E
  !
  address-family ipv4
    neighbor 10.0.2.1 activate
    neighbor 10.0.6.1 activate
    neighbor 10.0.4.2 activate
    neighbor 10.0.2.1 route-map FILTER out
  exit-address-family
!
