hostname A
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 ip address 10.0.1.2 255.255.255.252
 description Connection to B
!
interface GigabitEthernet0/1
 ip address 10.0.3.1 255.255.255.252
 description Connection to F
!
!

router bgp 200
  neighbor 10.0.1.1 remote-as 100
  neighbor 10.0.1.1 description Connection to B
  
  neighbor 10.0.3.2 remote-as 300
  neighbor 10.0.3.2 description Connection to F
  
  !
  address-family ipv4
    neighbor 10.0.1.1 activate
    neighbor 10.0.3.2 activate
  exit-address-family
!