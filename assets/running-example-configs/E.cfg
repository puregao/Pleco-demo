hostname E
!
interface GigabitEthernet0/0
 ip address 10.0.5.2 255.255.255.252
 description Connection to F
!
interface GigabitEthernet0/1
 ip address 10.0.7.2 255.255.255.252
 description Connection to D
!
interface GigabitEthernet0/2
 ip address 10.0.8.2 255.255.255.252
 description Connection to B
!
interface GigabitEthernet0/3
 ip address 10.0.4.2 255.255.255.252
 description Connection to B
!
router bgp 500
  neighbor 10.0.5.1 remote-as 300
  neighbor 10.0.5.1 description Connection to F

  neighbor 10.0.7.1 remote-as 400
  neighbor 10.0.7.1 description Connection to D

  neighbor 10.0.8.1 remote-as 100
  neighbor 10.0.8.1 description Connection to B

  neighbor 10.0.4.1 remote-as 600
  neighbor 10.0.4.1 description Connection to C
  !
  address-family ipv4
    neighbor 10.0.5.1 activate
    neighbor 10.0.7.1 activate
    neighbor 10.0.8.1 activate
    neighbor 10.0.4.1 activate
  exit-address-family
!