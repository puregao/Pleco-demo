hostname B
!

interface GigabitEthernet0/0
 ip address 10.0.1.1 255.255.255.252
 description Connection to A
!
interface GigabitEthernet0/1
 ip address 10.0.2.1 255.255.255.252
 description Connection to C
!
interface GigabitEthernet0/2
 ip address 10.0.8.1 255.255.255.252
 description Connection to E
!
router bgp 100
  neighbor 10.0.1.2 remote-as 200
  neighbor 10.0.1.2 description Connection to A

  neighbor 10.0.2.2 remote-as 600
  neighbor 10.0.2.2 description Connection to C

  neighbor 10.0.8.2 remote-as 500
  neighbor 10.0.8.2 description Connection to E
  !
  address-family ipv4
    neighbor 10.0.2.2 activate
    neighbor 10.0.1.2 activate
    neighbor 10.0.8.2 activate
  exit-address-family
!