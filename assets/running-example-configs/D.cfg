hostname D
!
interface GigabitEthernet0/0
 ip address 10.0.6.1 255.255.255.252
 description Connection to C
!
interface GigabitEthernet0/1
 ip address 10.0.7.1 255.255.255.252
 description Connection to E
!
interface GigabitEthernet0/2
 ip address 20.0.0.5 255.0.0.0
!



router bgp 400
  neighbor 10.0.6.2 remote-as 600
  neighbor 10.0.6.2 description Connection to C

  neighbor 10.0.7.2 remote-as 500
  neighbor 10.0.7.2 description Connection to E
  !
  address-family ipv4
    network 20.0.0.0 mask 255.0.0.0
    neighbor 10.0.6.2 activate
    neighbor 10.0.7.2 activate 
  exit-address-family
!